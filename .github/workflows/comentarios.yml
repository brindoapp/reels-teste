name: Responder comentários
on:
  schedule:
    - cron: "*/20 11-23 * * *"  # a cada 20 min, 08h às 20h59 de Brasília
    - cron: "*/20 0-2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: comentarios
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IG_USER_ID_LEELEO: ${{ secrets.IG_USER_ID_LEELEO }}
      IG_TOKEN_LEELEO: ${{ secrets.IG_TOKEN_LEELEO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python robo.py responder leeleo
      - name: Guardar
        run: |
          git config user.name "robo-reels"
          git config user.email "robo-reels@users.noreply.github.com"
          git add contas/*/respondidos.tsv
          git diff --cached --quiet || (git commit -m "comentarios $(date -u +%F_%H%M)" && git pull --rebase && git push)
