name: Postar Reels de teste
on:
  schedule:  # 10 por dia, horário de Brasília = UTC-3 (08h a 23h BRT)
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "0 14 * * *"
    - cron: "30 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 18 * * *"
    - cron: "0 20 * * *"
    - cron: "30 21 * * *"
    - cron: "0 23 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      conta:
        description: "Conta (pasta em contas/)"
        default: "leeleo"
permissions:
  contents: write
concurrency: postar
jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_USER_ID_LEELEO: ${{ secrets.IG_USER_ID_LEELEO }}
      IG_TOKEN_LEELEO: ${{ secrets.IG_TOKEN_LEELEO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python robo.py postar "${{ github.event.inputs.conta || 'leeleo' }}"
      - name: Guardar o que foi postado
        run: |
          git config user.name "robo-reels"
          git config user.email "robo-reels@users.noreply.github.com"
          git add contas/*/feitos.tsv
          git diff --cached --quiet || (git commit -m "postado $(date -u +%F_%H%M)" && git push)
